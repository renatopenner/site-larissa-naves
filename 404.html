  <script>
    (function(){
      var p = decodeURIComponent(location.pathname || '/').replace(/\/+$/, '');
      var map = {
        '/agende': '/agende.html',
        '/blog': '/blog.html',
        '/divorcio': '/divorcio.html',

        '/planejamentopatrimonial': '/planejamentopatrimonial.html',
        '/reconhecimentouniaoestavel': '/reconhecimentouniaoestavel.html',
        '/regulamentacaovisitas': '/regulamentacaovisitas.html',
        '/service-page/acordos': '/service-page__acordos.html',
        '/service-page/consultoria-individualizada': '/service-page__consultoria-individualizada.html',
        '/service-page/consultoria-jurídica-para-advogados': '/service-page__consultoria-jur-dica-para-advogados.html',

      };
      var target = map[p.toLowerCase()];
      if (!target && p && !/\.html$/i.test(p)) {
        target = p + '.html';
      }
      if (target) {
        location.replace(target + location.search + location.hash);
      } else {
        location.replace('/');
      }
    })();
  </script>
</head>
